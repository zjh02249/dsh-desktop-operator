name: GitHub Releases

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release
        shell: pwsh
        run: |
          $package = Get-Content -Raw package.json | ConvertFrom-Json
          $packageTag = "v$($package.version)"
          if ('${{ github.ref }}'.StartsWith('refs/tags/v')) {
            $tag = '${{ github.ref_name }}'
            if ($tag -ne $packageTag) {
              throw "Tag $tag does not match package version $($package.version)."
            }
            $shouldRelease = 'true'
            $createTag = 'false'
          } else {
            $tag = $packageTag
            $remoteTag = [string](& git ls-remote --tags origin "refs/tags/$tag")
            if ($LASTEXITCODE -ne 0) {
              throw "Could not inspect remote tag $tag."
            }
            if (-not [string]::IsNullOrWhiteSpace($remoteTag)) {
              $shouldRelease = 'false'
              $createTag = 'false'
            } else {
              $shouldRelease = 'true'
              $createTag = 'true'
            }
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "should_release=$shouldRelease" >> $env:GITHUB_OUTPUT
          "create_tag=$createTag" >> $env:GITHUB_OUTPUT

      - uses: pnpm/action-setup@v4
        if: steps.release.outputs.should_release == 'true'
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        if: steps.release.outputs.should_release == 'true'
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-go@v5
        if: steps.release.outputs.should_release == 'true'
        with:
          go-version: '1.27.x'
          cache-dependency-path: runtime/windows/go.mod

      - run: pnpm install --frozen-lockfile
        if: steps.release.outputs.should_release == 'true'

      - name: Test, build, and package
        if: steps.release.outputs.should_release == 'true'
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          WINDOWS_SIGNING_CERT_THUMBPRINT: ${{ secrets.WINDOWS_SIGNING_CERT_THUMBPRINT }}
          WINDOWS_SIGNING_REQUIRED: ${{ vars.WINDOWS_SIGNING_REQUIRED }}
        run: pnpm package:plugin

      - name: Verify isolated DSH upgrade and rollback
        if: steps.release.outputs.should_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $currentTag = '${{ steps.release.outputs.tag }}'
          $repository = '${{ github.repository }}'
          New-Item -ItemType Directory -Path artifacts/dsh-cli -Force | Out-Null
          & pnpm --dir artifacts/dsh-cli add `
            --ignore-scripts `
            --config.auto-install-peers=false `
            --save-exact `
            '@deepseek-ai/dsh@0.1.0-rc.6'
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not install the isolated DSH CLI used by the compatibility test.'
          }
          $dshCliPath = Resolve-Path 'artifacts/dsh-cli/node_modules/@deepseek-ai/dsh/lib/bin.js'
          $releasesJson = [string](& gh release list --repo $repository --limit 100 --json tagName,isDraft,isPrerelease)
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not enumerate previous releases.'
          }
          $candidates = @($releasesJson | ConvertFrom-Json | Where-Object {
            -not $_.isDraft -and -not $_.isPrerelease -and $_.tagName -ne $currentTag -and $_.tagName -match '^v\d+\.\d+\.\d+$'
          } | ForEach-Object {
            [pscustomobject]@{ tag = $_.tagName; version = [version]$_.tagName.Substring(1) }
          } | Sort-Object version -Descending)
          if ($candidates.Count -eq 0) {
            throw 'No previous stable release is available for upgrade/rollback verification.'
          }
          $previousTag = $candidates[0].tag
          New-Item -ItemType Directory -Path artifacts/rollback-input -Force | Out-Null
          & gh release download $previousTag `
            --repo $repository `
            --pattern 'dsh-desktop-operator-*.tgz' `
            --dir artifacts/rollback-input
          if ($LASTEXITCODE -ne 0) {
            throw "Could not download the plugin package from $previousTag."
          }
          $previousPackages = @(Get-ChildItem artifacts/rollback-input -Filter '*.tgz' -File)
          $currentPackages = @(Get-ChildItem artifacts/package -Filter '*.tgz' -File)
          if ($previousPackages.Count -ne 1 -or $currentPackages.Count -ne 1) {
            throw "Expected one previous and one current package; found $($previousPackages.Count) and $($currentPackages.Count)."
          }
          & ./scripts/verify-dsh-upgrade-rollback.ps1 `
            -PreviousPackagePath $previousPackages[0].FullName `
            -CurrentPackagePath $currentPackages[0].FullName `
            -DshCliPath $dshCliPath

      - name: Prepare release assets and checksums
        id: assets
        if: steps.release.outputs.should_release == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/release -Force | Out-Null
          $packages = @(Get-ChildItem artifacts/package -Filter '*.tgz' -File)
          if ($packages.Count -ne 1) {
            throw "Expected exactly one package archive, found $($packages.Count)."
          }
          $package = $packages[0]
          Copy-Item -LiteralPath $package.FullName -Destination artifacts/release/$($package.Name)
          Copy-Item runtime/bin/win32-x64/open-computer-use.exe artifacts/release/open-computer-use-win32-x64.exe
          Copy-Item runtime/bin/win32-arm64/open-computer-use.exe artifacts/release/open-computer-use-win32-arm64.exe
          Copy-Item runtime/bin/runtime-manifest.json artifacts/release/runtime-manifest.json
          Copy-Item artifacts/security/*.json artifacts/release/
          $sboms = @(Get-ChildItem artifacts/release -Filter '*.cdx.json' -File)
          if ($sboms.Count -ne 1) {
            throw "Expected exactly one CycloneDX SBOM, found $($sboms.Count)."
          }
          function Get-Sha256([string]$Path) {
            $stream = [System.IO.File]::OpenRead($Path)
            $sha256 = [System.Security.Cryptography.SHA256]::Create()
            try {
              return (($sha256.ComputeHash($stream) | ForEach-Object { $_.ToString("x2") }) -join "")
            } finally {
              $sha256.Dispose()
              $stream.Dispose()
            }
          }
          $lines = Get-ChildItem artifacts/release -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = Get-Sha256 $_.FullName
              "$hash  $($_.Name)"
            }
          [System.IO.File]::WriteAllLines(
            (Join-Path $PWD 'artifacts/release/SHA256SUMS.txt'),
            $lines,
            [System.Text.UTF8Encoding]::new($false)
          )
          "package_path=artifacts/release/$($package.Name)" >> $env:GITHUB_OUTPUT
          "sbom_path=artifacts/release/$($sboms[0].Name)" >> $env:GITHUB_OUTPUT

      - name: Attest release build provenance
        if: steps.release.outputs.should_release == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: artifacts/release/*

      - name: Attest plugin SBOM
        if: steps.release.outputs.should_release == 'true'
        uses: actions/attest-sbom@v4
        with:
          subject-path: ${{ steps.assets.outputs.package_path }}
          sbom-path: ${{ steps.assets.outputs.sbom_path }}

      - uses: actions/upload-artifact@v4
        if: steps.release.outputs.should_release == 'true'
        with:
          name: dsh-desktop-operator-${{ steps.release.outputs.tag }}
          path: artifacts/release/*
          if-no-files-found: error

      - name: Create version tag
        if: steps.release.outputs.create_tag == 'true'
        shell: pwsh
        run: |
          $tag = '${{ steps.release.outputs.tag }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a $tag -m "Release $tag"
          git push origin $tag

      - name: Create or update GitHub Release
        if: steps.release.outputs.should_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.release.outputs.tag }}'
          $repository = '${{ github.repository }}'
          & gh release view $tag --repo $repository 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            & gh release create $tag `
              --verify-tag `
              --generate-notes `
              --title $tag `
              --repo $repository
            if ($LASTEXITCODE -ne 0) {
              throw "Could not create GitHub Release $tag."
            }
          }

          $assets = @(Get-ChildItem artifacts/release -File)
          foreach ($asset in $assets) {
            & gh release upload $tag $asset.FullName --clobber --repo $repository
            if ($LASTEXITCODE -ne 0) {
              throw "Could not upload release asset $($asset.Name)."
            }
          }

          & gh release edit $tag --draft=false --repo $repository
          if ($LASTEXITCODE -ne 0) {
            throw "Could not publish GitHub Release $tag."
          }

          $releaseJson = [string](& gh release view $tag --repo $repository --json assets,isDraft,url)
          if ($LASTEXITCODE -ne 0) {
            throw "Could not verify GitHub Release $tag."
          }
          $release = $releaseJson | ConvertFrom-Json
          if ($release.isDraft) {
            throw "GitHub Release $tag is still a draft after publication."
          }
          $expectedUrl = "https://github.com/$repository/releases/tag/$tag"
          if ($release.url -ne $expectedUrl) {
            throw "GitHub Release $tag returned unexpected public URL '$($release.url)'."
          }
          $publishedAssets = @($release.assets | ForEach-Object { $_.name })
          $missingAssets = @($assets.Name | Where-Object { $_ -notin $publishedAssets })
          if ($missingAssets.Count -gt 0) {
            throw "GitHub Release $tag is missing assets: $($missingAssets -join ', ')"
          }

  backfill-release-pages:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create missing release pages for historical tags
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            if [[ -z "$tag" ]] || gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              continue
            fi
            gh release create "$tag" \
              --verify-tag \
              --generate-notes \
              --title "$tag" \
              --repo "$GITHUB_REPOSITORY"
          done < <(git tag --list 'v*' --sort=version:refname)
